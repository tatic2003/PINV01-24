# Two edge nodes of the IoT-ITS pipeline, each with its own MQTT broker,
# server, bridge and DAG synchronization agent, as on the test bench.
#
#   docker compose up -d --build               start both nodes
#   docker compose run --rm demo               10 emulated devices announce themselves
#   docker compose logs -f bridge-a bridge-b   follow the registrations
#   docker compose down                        stop (add -v to delete the keys)
#
# Server of node A: http://localhost:5000, of node B: http://localhost:5001.
# The CSVs of the bridges, the agents and the generator are written to
# docker/out/. These containers are for trying the system; the timings of
# the article were measured on the boards without containers.

x-app: &app
  build: .
  image: pinv01-24
  restart: unless-stopped
  volumes:
    - ./docker/out:/out

x-server-health: &server-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
  interval: 5s
  timeout: 6s
  retries: 30
  start_period: 10s

services:
  keys:
    <<: *app
    restart: "no"
    command: ["python", "docker/make_keys.py", "/keys", "edge-a", "edge-b"]
    volumes:
      - keys:/keys

  broker-a:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  broker-b:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  server-a:
    <<: *app
    command: ["python", "run_server.py", "--node-id", "edge-a",
              "--dag-key-file", "/keys/edge-a.key",
              "--dag-trusted-keys", "/keys/trusted_keys.json",
              "--dag-require-signatures"]
    ports:
      - "5000:5000"
    volumes:
      - keys:/keys
    depends_on:
      keys:
        condition: service_completed_successfully
    healthcheck: *server-health

  server-b:
    <<: *app
    command: ["python", "run_server.py", "--node-id", "edge-b",
              "--dag-key-file", "/keys/edge-b.key",
              "--dag-trusted-keys", "/keys/trusted_keys.json",
              "--dag-require-signatures"]
    ports:
      - "5001:5000"
    volumes:
      - keys:/keys
    depends_on:
      keys:
        condition: service_completed_successfully
    healthcheck: *server-health

  bridge-a:
    <<: *app
    command: ["python", "mqtt_http_bridge.py", "--mqtt-host", "broker-a",
              "--http-host", "server-a", "--http-port", "5000",
              "--csv", "/out/bridge_a.csv", "--onboarding-csv", "/out/onboarding_a.csv"]
    depends_on:
      broker-a:
        condition: service_started
      server-a:
        condition: service_healthy

  bridge-b:
    <<: *app
    command: ["python", "mqtt_http_bridge.py", "--mqtt-host", "broker-b",
              "--http-host", "server-b", "--http-port", "5000",
              "--csv", "/out/bridge_b.csv", "--onboarding-csv", "/out/onboarding_b.csv"]
    depends_on:
      broker-b:
        condition: service_started
      server-b:
        condition: service_healthy

  sync-a:
    <<: *app
    command: ["python", "experiments/dag_sync.py", "--local", "http://server-a:5000",
              "--peer", "http://server-b:5000", "--csv", "/out/sync_a.csv"]
    depends_on:
      server-a:
        condition: service_healthy
      server-b:
        condition: service_healthy

  sync-b:
    <<: *app
    command: ["python", "experiments/dag_sync.py", "--local", "http://server-b:5000",
              "--peer", "http://server-a:5000", "--csv", "/out/sync_b.csv"]
    depends_on:
      server-a:
        condition: service_healthy
      server-b:
        condition: service_healthy

  # Optional: 10 emulated devices from the calibrated catalogue, split
  # between the two brokers. Run it with: docker compose run --rm demo
  demo:
    <<: *app
    restart: "no"
    profiles: ["demo"]
    command: ["python", "experiments/load_generator.py", "--host", "broker-a", "broker-b",
              "--label", "demo", "--mode", "burst", "--n", "10",
              "--csv", "/out/generator_demo.csv"]
    depends_on:
      bridge-a:
        condition: service_started
      bridge-b:
        condition: service_started

volumes:
  keys:
