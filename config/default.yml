# IoT-ITS Server Configuration
# Project: PINV01-24 - FIUNA
# Copy this file to config.yml and customize

# Server settings
host: "0.0.0.0"
port: 5000
debug: false
node_id: "edge-node-01"

# Data directories
data_dir: "./data"
ontology_dir: "./ontology"
model_dir: "./models"

# Device management
device_timeout: 120.0        # seconds before marking inactive
health_check_interval: 30.0  # seconds between health checks

# PnP-AI Classification
classifier_type: "rule_based"  # Options: rule_based, decision_tree, random_forest
classifier_confidence_threshold: 0.6
auto_train: true
training_samples: 500

# BlockDAG Event Logging
enable_dag: true
dag_sync_interval: 60.0      # seconds between sync attempts
max_dag_events: 10000        # max events to keep locally

# Logging
log_level: "INFO"            # Options: DEBUG, INFO, WARNING, ERROR
log_file: null               # Set to path for file logging

# Security (future)
enable_auth: false
api_key: null
