<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F2933"/><stop offset="0.55" stop-color="#27414F"/><stop offset="1" stop-color="#2A6F6A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" fill="url(#sky)"/>

  <!-- edge network / DAG -->
  <g stroke="#9FE0D4" stroke-opacity="0.45" stroke-width="2" fill="none">
    <path d="M40 40 L110 26 L150 70 L90 92 Z"/><path d="M1060 30 L1120 62 L1170 34 M1120 62 L1150 100"/>
  </g>
  <g fill="#9FE0D4" fill-opacity="0.8">
    <circle cx="40" cy="40" r="5"/><circle cx="110" cy="26" r="5"/><circle cx="150" cy="70" r="6"/><circle cx="90" cy="92" r="4"/>
    <circle cx="1060" cy="30" r="4"/><circle cx="1120" cy="62" r="6"/><circle cx="1170" cy="34" r="5"/><circle cx="1150" cy="100" r="4"/>
  </g>

  <!-- traffic light -->
  <g transform="translate(95,190)">
    <rect x="-3" y="20" width="6" height="95" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="-16" y="-38" width="32" height="64" rx="7" fill="#14213D" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
    <circle cx="0" cy="-24" r="7" fill="#FF5A5F"/><circle cx="0" cy="-6" r="7" fill="#FFC857"/><circle cx="0" cy="12" r="7" fill="#3DDC97"/>
  </g>

  <!-- roadside unit -->
  <g transform="translate(1105,190)">
    <rect x="-3" y="0" width="6" height="115" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="-22" y="-14" width="44" height="22" rx="4" fill="#14213D" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
    <circle cx="0" cy="-3" r="3.5" fill="#3DDC97"/>
    <g fill="none" stroke="#9FE0D4" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round">
      <path d="M-34 -30 A40 40 0 0 1 34 -30"/><path d="M-22 -22 A26 26 0 0 1 22 -22"/>
    </g>
  </g>

  <!-- title -->
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#FFFFFF">
    <text x="600" y="92" font-size="52" font-weight="800">Interoperability of heterogeneous</text>
    <text x="600" y="152" font-size="52" font-weight="800">devices in ITS</text>
    <text x="600" y="196" font-size="23" font-weight="600" fill="#D4E7E3">Semantic validation, PnP-AI and DAG-based synchronization on edge hardware</text>
  </g>

  <!-- road -->
  <path d="M0 268 C 300 246, 600 258, 900 248 S 1150 244, 1200 248 L1200 340 L0 340 Z" fill="#111A21"/>
  <path d="M0 296 C 300 276, 600 288, 900 278 S 1150 274, 1200 278" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="34 26"/>

  <!-- car -->
  <g transform="translate(470,252)">
    <path d="M0 22 L8 8 Q12 2 20 2 L58 2 Q66 2 72 8 L84 20 L96 22 Q102 24 102 30 L102 36 L0 36 Z" fill="#E63946"/>
    <path d="M22 8 L56 8 L66 20 L16 20 Z" fill="#DCEBFA"/>
    <rect x="94" y="25" width="7" height="5" rx="1" fill="#FFE8A3"/>
    <circle cx="22" cy="37" r="8" fill="#14213D"/><circle cx="80" cy="37" r="8" fill="#14213D"/>
    <circle cx="22" cy="37" r="3" fill="#C9D3E0"/><circle cx="80" cy="37" r="3" fill="#C9D3E0"/>
  </g>
</svg>
